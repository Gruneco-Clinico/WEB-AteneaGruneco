<div class="form-group">
  <label><strong>{{ numero }}. {{ label }}</strong></label>
  <select class="form-control toggle-subitems" name="{{ nombre }}" data-target="grupo{{ numero }}" required>
    <option value="" disabled selected>Seleccione una opción</option>
    <option value="si">Sí</option>
    <option value="no">No</option>
    <option value="ns">No Sabe</option>
  </select>
</div>

<div class="ml-4 mb-3 border-left pl-3 d-none" id="grupo{{ numero }}">
  <!-- Frecuencia -->
  <div class="form-group">
    <label>Frecuencia</label>
    <select class="form-control frecuencia-select" name="{{ nombre }}_frecuencia" data-item="{{ nombre }}">
      <option value="" disabled selected>Seleccione una opción</option>
      <option value="1" data-text="1. Ocasionalmente">1. Ocasionalmente</option>
      <option value="2" data-text="2. A menudo">2. A menudo</option>
      <option value="3" data-text="3. Frecuentemente">3. Frecuentemente</option>
      <option value="4" data-text="4. Muy frecuentemente">4. Muy frecuentemente</option>
    </select>
    <input type="hidden" name="{{ nombre }}_frecuencia_texto" id="{{ nombre }}_frecuencia_texto">
  </div>

  <!-- Gravedad -->
  <div class="form-group">
    <label>Gravedad</label>
    <select class="form-control gravedad-select" name="{{ nombre }}_gravedad" data-item="{{ nombre }}">
      <option value="" disabled selected>Seleccione una opción</option>
      <option value="1" data-text="1. Leve">1. Leve</option>
      <option value="2" data-text="2. Moderada">2. Moderada</option>
      <option value="3" data-text="3. Marcada">3. Marcada</option>
    </select>
    <input type="hidden" name="{{ nombre }}_gravedad_texto" id="{{ nombre }}_gravedad_texto">
  </div>

  <!-- Resultado FG -->
  <div class="form-group">
    <label>Frecuencia × Gravedad</label>
    <input type="text" class="form-control resultado-fg" name="{{ nombre }}_resultado" id="{{ nombre }}_resultado" readonly value="0">
  </div>

  <!-- Distrés -->
  <div class="form-group">
    <label>Distrés</label>
    <select class="form-control distres-select" name="{{ nombre }}_distres" data-item="{{ nombre }}">
      <option value="" disabled selected>Seleccione una opción</option>
      <option value="1" data-text="1. Nada">1. Nada</option>
      <option value="2" data-text="2. Leve">2. Leve</option>
      <option value="3" data-text="3. Moderada">3. Moderada</option>
      <option value="4" data-text="4. Marcada">4. Marcada</option>
      <option value="5" data-text="5. Extrema">5. Extrema</option>
    </select>
    <input type="hidden" name="{{ nombre }}_distres_texto" id="{{ nombre }}_distres_texto">
  </div>
</div>
