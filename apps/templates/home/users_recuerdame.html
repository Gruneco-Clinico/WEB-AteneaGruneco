{% extends 'layouts/base.html' %}
{% block content %}

<div class="container mt-5">
  <h2>Usuarios registrados en RecuerdaMe</h2>
  <table class="table table-hover mt-4">
    <thead>
      <tr>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for email in user_emails %}
      <tr>
        <td>{{ email }}</td>
        <td>
          <a href="{% url 'estadisticas_usuario_detalle' email=email %}" class="btn btn-sm btn-neutral">
            <i class="fas fa-chart-bar"></i> Ver métricas
          </a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="2">No hay usuarios con métricas</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
