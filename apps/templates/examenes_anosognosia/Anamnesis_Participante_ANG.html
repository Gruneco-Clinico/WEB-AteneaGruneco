{% extends 'layouts/base.html' %}
{% block content %}

<div class="header bg-primary pb-6">
  <div class="container-fluid">
    <div class="header-body">
      <div class="row align-items-center py-4">
        <div class="col-lg-6 col-5">
          <h6 class="h2 text-white d-inline-block mb-0">Evaluación Médica Participante</h6>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--6">
  <div class="row">
    <div class="col">
      <div class="card shadow">
        <form method="post" action="{% url 'guardar_anamnesis_participante' %}">
          {% csrf_token %}
          <input type="hidden" name="visita_id" value="{{ visita_examen }}">
          <input type="hidden" name="paciente_id" value="{{ paciente_id }}">
          <input type="hidden" name="examen_id" value="{{ examen_id }}">

          <div class="card-body">

            <!-- NOMBRES Y APELLIDOS -->
            <div class="form-group">
              <label for="nombres_apellidos"><strong>Nombres y apellidos</strong></label>
              <input type="text" class="form-control" name="nombres_apellidos" id="nombres_apellidos"
                     value="{{ paciente.primer_nombre }} {{ paciente.primer_apellido }}" required>
            </div>

            <!-- DOCUMENTO -->
            <div class="form-group">
              <label for="documento"><strong>Tipo de documento y número de identificación</strong></label>
              <input type="text" class="form-control" name="documento" id="documento"
                     value="{{ paciente.tipo_documento }} {{ paciente.numero_documento }}" required>
            </div>

            <!-- LUGAR DE NACIMIENTO -->
            <div class="form-group">
              <label for="lugar_nacimiento"><strong>Lugar de nacimiento</strong></label>
              <input type="text" class="form-control" name="lugar_nacimiento" id="lugar_nacimiento"
                     value="{{ paciente.municipio_nacimiento }} - {{ paciente.departamento_nacimiento }}" required>
            </div>

            <!-- EDAD -->
            <div class="form-group">
              <label for="edad"><strong>Edad</strong></label>
              <input type="number" class="form-control" name="edad" id="edad"
                     value="{{ paciente.edad|default:'' }}">
            </div>

            <!-- SEXO -->
            <!-- SEXO -->
            <div class="form-group">
              <label for="sexo"><strong>Sexo</strong></label>
              <select class="form-control" name="sexo" id="sexo">
                <option value="">Seleccione una opción</option>

                <option value="M" {% if paciente.genero == "M" %}selected{% endif %}>
                  Masculino
                </option>

                <option value="F" {% if paciente.genero == "F" %}selected{% endif %}>
                  Femenino
                </option>

                <option value="O" {% if paciente.genero == "O" %}selected{% endif %}>
                  Otro
                </option>
              </select>
            </div>

            <!-- TIEMPO DE ACOMPAÑAMIENTO -->
            <div class="form-group">
              <label for="tiempo_acompanando"><strong>Desde hace cuánto el acompañante acompaña al participante</strong></label>
              <input type="text" class="form-control" name="tiempo_acompanando" id="tiempo_acompanando"
                     value="{{ datos_examen.tiempo_acompanando|default:'' }}">
            </div>

            <!-- SALARIOS -->
            <div class="form-group">
              <label for="ingresos_hogar"><strong>No. de salarios mínimos que entran al hogar</strong></label>
              <select class="form-control" name="ingresos_hogar" id="ingresos_hogar">
                {% if datos_examen.ingresos_hogar %}
                <option value="{{ datos_examen.ingresos_hogar }}" selected>{{ datos_examen.ingresos_hogar }}</option>
                {% else %}
                <option value="">Seleccione una opción</option>
                {% endif %}
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2 a 3">2 a 3</option>
                <option value="Más de 3">Más de 3</option>
              </select>
            </div>

            <!-- ESTRATO -->
            <div class="form-group">
              <label for="estrato"><strong>Estrato socioeconómico en el que reside</strong></label>
              <input type="number" class="form-control" name="estrato" id="estrato"
                     value="{{ datos_examen.estrato|default:'' }}">
            </div>

            <!-- RELIGIÓN -->
            <div class="form-group">
              <label for="religion"><strong>Religión</strong></label>
              <input type="text" class="form-control" name="religion" id="religion"
                     value="{{ paciente.religion|default:'' }}">
            </div>

            <!-- LATERALIDAD -->
            <div class="form-group">
              <label for="lateralidad"><strong>Lateralidad</strong></label>
              <select class="form-control" name="lateralidad" id="lateralidad">
                <option value="">Seleccione una opción</option>

                <option value="Diestro"
                  {% if paciente.lateralidad == "Diestro" %}selected{% endif %}>
                  Diestro
                </option>

                <option value="Zurdo"
                  {% if paciente.lateralidad == "Zurdo" %}selected{% endif %}>
                  Zurdo
                </option>

                <option value="Ambidiestro"
                  {% if paciente.lateralidad == "Ambidiestro" %}selected{% endif %}>
                  Ambidiestro
                </option>
              </select>
            </div>


            <!-- CON QUIÉN VIVE -->
            <div class="form-group">
              <label for="convivencia"><strong>Con quién vive</strong></label>
              <textarea class="form-control" name="convivencia" id="convivencia" rows="2">{{ datos_examen.convivencia|default:'' }}</textarea>
              <small class="text-muted">Incluir mascotas</small>
            </div>

            <!-- EPS -->
            <div class="form-group">
              <label for="eps"><strong>EPS</strong></label>
              <input type="text" class="form-control" name="eps" id="eps"
                     value="{{ paciente.eps|default:'' }}">
            </div>

            <!-- BOTONES -->
            <div class="text-right mt-4">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a href="{% url 'detalle_paciente' paciente_id %}" class="btn btn-secondary">Ver Paciente</a>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
