{% extends 'layouts/base.html' %}
{% block content %}

<div class="header bg-primary pb-6">
  <div class="container-fluid">
    <div class="header-body">
      <div class="row align-items-center py-4">
        <div class="col-lg-6 col-5">
          <h6 class="h2 text-white d-inline-block mb-0">Registro de Sesiones</h6>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--6">
  <div class="row">
    <div class="col">
      <div class="card shadow">
        <form method="post" action="{% url 'guardar_intervenciones' %}">
          {% csrf_token %}
          <input type="hidden" name="visita_id" value="{{ visita_examen }}">
          <input type="hidden" name="paciente_id" value="{{ paciente_id }}">
          <input type="hidden" name="examen_id" value="{{ examen_id }}">

          <div class="card-body">

            <!-- Selección del número de sesión -->
            <div class="form-group">
              <label for="num_sesion"><strong>Seleccione la sesión</strong></label>
              <select class="form-control" id="num_sesion" name="num_sesion" required>
                <option value="">Seleccione una sesión</option>

                {% load exam_filters %}
                {% for i in 1|to:24 %}
                  <option value="{{ i }}">Sesión {{ i }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Contenedor dinámico -->
            <div id="form_sesion" style="display:none;">
              <div class="card mb-3">
                <div class="card-header bg-light">
                  <strong>Sesión seleccionada</strong>
                </div>
                <div class="card-body">

                  <div class="form-group">
                    <label for="nombre"><strong>Nombre de la sesión</strong></label>
                    <input type="text" class="form-control" name="nombre" id="nombre"
                          value="{{ datos_sesion.nombre_sesion|default:'' }}">
                  </div>

                  <div class="form-group">
                    <label for="fecha"><strong>Fecha</strong></label>
                    <input type="date" class="form-control" name="fecha" id="fecha"
                          value="{{ datos_sesion.fecha|date:'Y-m-d' }}">
                  </div>

                  <div class="form-row">
                    <div class="col">
                      <label for="hora_inicio"><strong>Hora inicio</strong></label>
                      <input type="time" class="form-control" name="hora_inicio" id="hora_inicio"
                            value="{{ datos_sesion.hora_inicio|time:'H:i' }}">
                    </div>
                    <div class="col">
                      <label for="hora_fin"><strong>Hora fin</strong></label>
                      <input type="time" class="form-control" name="hora_fin" id="hora_fin"
                            value="{{ datos_sesion.hora_fin|time:'H:i' }}">
                    </div>
                  </div>

                  <div class="form-group mt-3">
                    <label for="asistencia"><strong>Asistencia</strong></label>
                    <select class="form-control" name="asistencia" id="asistencia" required>
                      {% if datos_sesion.asistencia %}
                        <option value="{{ datos_sesion.asistencia }}" selected>{{ datos_sesion.asistencia }}</option>
                      {% else %}
                        <option value="">Seleccione</option>
                      {% endif %}
                      <option value="Sí">Sí</option>
                      <option value="No">No</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="participacion"><strong>Nivel de participación (1-5)</strong></label>
                    <select class="form-control" name="participacion" id="participacion" required>
                      {% if datos_sesion.participacion %}
                        <option value="{{ datos_sesion.participacion }}" selected>{{ datos_sesion.participacion }}</option>
                      {% else %}
                        <option value="">Seleccione</option>
                      {% endif %}
                      <option value="1">1. Muy baja: No participa o lo hace mínimamente, mostrando desinterés o pasividad.</option>
                      <option value="2">2. Baja: Participa de manera limitada; su contribución es esporádica y poco activa.</option>
                      <option value="3">3. Moderada: Participa de manera consistente, pero con iniciativa limitada o solo cuando se le solicita.</option>
                      <option value="4">4. Alta: Participa activamente, contribuye con ideas y se involucra en la mayoría de actividades.</option>
                      <option value="5">5. Muy alta: Participa de manera excepcional, lidera discusiones, propone ideas y motiva a otros a involucrarse.</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="estado"><strong>Estado del participante</strong></label>
                    <select class="form-control" name="estado" id="estado">
                      {% if datos_sesion.estado %}
                        <option value="{{ datos_sesion.estado }}" selected>{{ datos_sesion.estado }}</option>
                      {% else %}
                        <option value="">Seleccione</option>
                      {% endif %}
                      <option value="Motivado">Motivado</option>
                      <option value="Apático">Apático</option>
                      <option value="Fatigado">Fatigado</option>
                      <option value="Ansioso">Ansioso</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="tematica"><strong>Temática abordada</strong></label>
                    <input type="text" class="form-control" name="tematica" id="tematica"
                          value="{{ datos_sesion.tematica|default:'' }}">
                  </div>

                  <div class="form-group">
                    <label for="observaciones"><strong>Observaciones</strong></label>
                    <textarea class="form-control" name="observaciones" id="observaciones" rows="4">{{ datos_sesion.observaciones|default:'' }}</textarea>
                  </div>

                </div>
              </div>
            </div>

            

            <!-- Botones -->
            <div class="text-right mt-4">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <a href="{% url 'detalle_paciente' paciente_id %}" class="btn btn-secondary">Ver Paciente</a>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Resumen Final de Sesiones -->
  <div id="resumenFinal" style="display:none;" class="card mt-4">
    <div class="card-header bg-light">
      <strong>📊 Resumen de las 24 Sesiones</strong>
    </div>
    <div class="card-body">
      <ul>
        <li><strong>Porcentaje de asistencia:</strong> <span id="resumenAsistencia"></span>%</li>
        <li><strong>Sesiones asistidas:</strong> <span id="resumenConteo"></span></li>
        <li><strong>Promedio de participación:</strong> <span id="resumenPromedio"></span></li>
      </ul>
      <div id="resumenAlerta" style="color:red; font-weight:bold;"></div>

      <!-- Gráfico -->
      <canvas id="graficoParticipacion" height="120"></canvas>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.getElementById("num_sesion").addEventListener("change", function() {
  const formSesion = document.getElementById("form_sesion");
  const visitaId = "{{ visita_examen }}";  // Asegúrate de que aquí es el ID numérico
  const examenId = "{{ examen_id }}";
  const numSesion = this.value;

  if (numSesion) {
    // Mostrar el formulario apenas selecciona
    formSesion.style.display = "block";
    formSesion.querySelector(".card-header strong").innerText = "Sesión " + numSesion;

    // Construir la URL usando la ruta de Django
    const url = "{% url 'obtener_datos_sesion' 0 0 0 %}"
                  .replace("/0/0/0/", `/${visitaId}/${examenId}/${numSesion}/`);

    fetch(url)
      .then(response => response.json())
      .then(data => {
        // Rellenar los inputs con los datos recibidos
        document.getElementById("nombre").value = data.nombre || "";
        document.getElementById("fecha").value = data.fecha || "";
        document.getElementById("hora_inicio").value = data.hora_inicio || "";
        document.getElementById("hora_fin").value = data.hora_fin || "";
        document.getElementById("asistencia").value = data.asistencia || "";
        document.getElementById("participacion").value = data.participacion || "";
        document.getElementById("estado").value = data.estado || "";
        document.getElementById("tematica").value = data.tematica || "";
        document.getElementById("observaciones").value = data.observaciones || "";
      })
      .catch(error => {
        console.error("Error cargando datos de la sesión:", error);
      });

  } else {
    // Si no selecciona nada, esconder
    formSesion.style.display = "none";
  }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const urlResumen = "{% url 'resumen_sesiones' visita_examen examen_id %}";

  fetch(urlResumen)
    .then(response => response.json())
    .then(data => {
      if (!data.error) {
        document.getElementById("resumenFinal").style.display = "block";

        document.getElementById("resumenAsistencia").textContent = data.porcentaje_asistencia;
        document.getElementById("resumenConteo").textContent = data.conteo_asistencia;
        document.getElementById("resumenPromedio").textContent = data.promedio_participacion;

        if (data.alerta) {
          document.getElementById("resumenAlerta").textContent = data.alerta;
        }

        // Gráfico de tendencia
        const ctx = document.getElementById("graficoParticipacion");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: data.tendencia_participacion.map((_, i) => "Sesión " + (i+1)),
            datasets: [{
              label: "Participación",
              data: data.tendencia_participacion,
              borderColor: "blue",
              fill: false,
              tension: 0.2
            }]
          }
        });
      }
    })
    .catch(error => console.error("Error cargando resumen:", error));
});
</script>



{% endblock %}
